name: ci

on:
  push:
    branches: [trunk]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./...
      - run: go test ./... -race
      - run: go vet ./...
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "not gofmt'd:"; echo "$unformatted"; exit 1
          fi

  # macOS cannot be tested from a Linux development machine, so this job is the
  # only thing that actually executes the darwin code paths -- the process table
  # reader and getfsstat. Compiling for darwin proves nothing about either.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: go build ./...
      - run: go test ./... -race
      - run: go vet ./...
      - name: Run it
        run: |
          go build -o reclaim ./cmd/reclaim
          ./reclaim version
          ./reclaim status
          ./reclaim clean --json > /tmp/out.json
          python3 -c "import json;json.load(open('/tmp/out.json'))"

  # The tool is meant to run on more than Debian, and the only way that claim
  # stays true is to keep checking it somewhere that is not Debian.
  distros:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        image: [fedora:latest, archlinux:latest, opensuse/tumbleweed, alpine:latest, debian:stable]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'
      - run: CGO_ENABLED=0 go build -buildvcs=false -o reclaim ./cmd/reclaim
      - name: Run on ${{ matrix.image }}
        run: |
          docker run --rm -v "$PWD/reclaim:/reclaim:ro" ${{ matrix.image }} sh -c '
            /reclaim version
            /reclaim status
            /reclaim clean --system --json > /tmp/out.json
            grep -q "system-" /tmp/out.json || { echo "no system unit registered"; exit 1; }
          '
